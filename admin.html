<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - HEVER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#000000',
                        secondary: '#ffffff',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-white text-black">
    <div id="login-form" class="min-h-screen flex items-center justify-center">
        <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
            <h1 class="text-2xl font-bold text-center mb-6">Administration HEVER</h1>
            <form id="admin-login">
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-2">Mot de passe</label>
                    <input type="password" id="admin-password" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-black">
                </div>
                <button type="submit" class="w-full bg-black text-white py-2 rounded-lg hover:bg-gray-800 transition">Se connecter</button>
            </form>
        </div>
    </div>

    <div id="admin-panel" class="hidden">
        <header class="bg-white text-black shadow-lg border-b border-gray-200">
            <div class="container mx-auto px-4 py-4 flex justify-between items-center">
                <div class="text-3xl font-bold tracking-wider">HEVER - Admin</div>
                <button id="logout" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600 transition">Déconnexion</button>
            </div>
        </header>

        <main class="container mx-auto px-4 py-8">
            <h1 class="text-3xl font-bold mb-8">Commandes</h1>

            <div id="orders-list" class="space-y-6">
                <!-- Orders will be loaded here -->
            </div>

            <div id="no-orders" class="text-center py-16 hidden">
                <i class="fas fa-shopping-bag text-6xl text-gray-300 mb-4"></i>
                <h2 class="text-2xl font-semibold mb-4">Aucune commande</h2>
            </div>
        </main>
    </div>

    <script src="admin.js"></script>
</body>
</html>
