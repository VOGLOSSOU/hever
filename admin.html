<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - HEVER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#000000',
                        secondary: '#ffffff',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-white text-black">
    <div id="login-form" class="min-h-screen flex items-center justify-center">
        <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
            <h1 class="text-2xl font-bold text-center mb-6">Administration HEVER</h1>
            <form id="admin-login">
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-2">Mot de passe</label>
                    <input type="password" id="admin-password" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-black">
                </div>
                <button type="submit" class="w-full bg-black text-white py-2 rounded-lg hover:bg-gray-800 transition">Se connecter</button>
            </form>
        </div>
    </div>

    <div id="admin-panel" class="hidden">
        <header class="bg-white text-black shadow-lg border-b border-gray-200">
            <div class="container mx-auto px-4 py-4 flex justify-between items-center">
                <div class="text-3xl font-bold tracking-wider">HEVER - Admin</div>
                <button id="logout" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600 transition">Déconnexion</button>
            </div>
        </header>

        <nav class="bg-gray-100 border-b">
            <div class="container mx-auto px-4">
                <div class="flex space-x-8">
                    <button id="tab-orders" class="py-4 px-2 border-b-2 border-transparent hover:border-black transition tab-button active" data-tab="orders">Commandes</button>
                    <button id="tab-categories" class="py-4 px-2 border-b-2 border-transparent hover:border-black transition tab-button" data-tab="categories">Catégories</button>
                    <button id="tab-products" class="py-4 px-2 border-b-2 border-transparent hover:border-black transition tab-button" data-tab="products">Produits</button>
                </div>
            </div>
        </nav>

        <main class="container mx-auto px-4 py-8">
            <!-- Orders Tab -->
            <div id="orders-section" class="tab-content">
                <h1 class="text-3xl font-bold mb-8">Commandes</h1>
                <div id="orders-list" class="space-y-6">
                    <!-- Orders will be loaded here -->
                </div>
                <div id="no-orders" class="text-center py-16 hidden">
                    <i class="fas fa-shopping-bag text-6xl text-gray-300 mb-4"></i>
                    <h2 class="text-2xl font-semibold mb-4">Aucune commande</h2>
                </div>
            </div>

            <!-- Categories Tab -->
            <div id="categories-section" class="tab-content hidden">
                <div class="flex justify-between items-center mb-8">
                    <h1 class="text-3xl font-bold">Catégories</h1>
                    <button id="add-category-btn" class="bg-black text-white px-6 py-3 rounded-lg hover:bg-gray-800 transition">
                        <i class="fas fa-plus mr-2"></i>Ajouter une catégorie
                    </button>
                </div>

                <div id="categories-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-8">
                    <!-- Categories will be loaded here -->
                </div>

                <!-- Add Category Form -->
                <div id="category-form" class="bg-gray-50 p-6 rounded-lg hidden">
                    <h2 class="text-2xl font-bold mb-6">Ajouter une catégorie</h2>
                    <form id="add-category-form" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium mb-2">Nom de la catégorie *</label>
                            <input type="text" id="category-name" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-black">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2">Description</label>
                            <textarea id="category-description" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-black"></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2">Image de la catégorie</label>
                            <input type="file" id="category-image" accept="image/*" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-black">
                        </div>
                        <div class="flex space-x-4">
                            <button type="submit" class="bg-black text-white px-6 py-2 rounded-lg hover:bg-gray-800 transition">Ajouter</button>
                            <button type="button" id="cancel-category" class="bg-gray-500 text-white px-6 py-2 rounded-lg hover:bg-gray-600 transition">Annuler</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Products Tab -->
            <div id="products-section" class="tab-content hidden">
                <div class="flex justify-between items-center mb-8">
                    <h1 class="text-3xl font-bold">Produits</h1>
                    <button id="add-product-btn" class="bg-black text-white px-6 py-3 rounded-lg hover:bg-gray-800 transition">
                        <i class="fas fa-plus mr-2"></i>Ajouter un produit
                    </button>
                </div>

                <div id="products-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-8">
                    <!-- Products will be loaded here -->
                </div>

                <!-- Add Product Form -->
                <div id="product-form" class="bg-gray-50 p-6 rounded-lg hidden">
                    <h2 class="text-2xl font-bold mb-6">Ajouter un produit</h2>
                    <form id="add-product-form" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium mb-2">Nom du produit *</label>
                            <input type="text" id="product-name" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-black">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2">Description</label>
                            <textarea id="product-description" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-black"></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2">Prix (FCFA) *</label>
                            <input type="number" id="product-price" step="0.01" min="0" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-black">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2">Image du produit</label>
                            <input type="file" id="product-image" accept="image/*" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-black">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2">Catégorie *</label>
                            <select id="product-category" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-black">
                                <option value="">Sélectionner une catégorie</option>
                                <!-- Categories will be loaded here -->
                            </select>
                        </div>
                        <div class="flex space-x-4">
                            <button type="submit" class="bg-black text-white px-6 py-2 rounded-lg hover:bg-gray-800 transition">Ajouter</button>
                            <button type="button" id="cancel-product" class="bg-gray-500 text-white px-6 py-2 rounded-lg hover:bg-gray-600 transition">Annuler</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="admin.js"></script>
</body>
</html>
