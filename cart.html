<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panier - HEVER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#000000',
                        secondary: '#ffffff',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-white text-black">
    <header class="bg-white text-black shadow-lg border-b border-gray-200">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="text-3xl font-bold tracking-wider">HEVER</a>
            <a href="cart.html" class="flex items-center space-x-2 hover:text-gray-600 transition">
                <i class="fas fa-shopping-cart text-xl"></i>
                <span>Panier (<span id="cart-count">0</span>)</span>
            </a>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold mb-8">Votre Panier</h1>

        <div id="cart-items" class="space-y-4">
            <!-- Cart items will be loaded here -->
        </div>

        <div id="empty-cart" class="text-center py-16 hidden">
            <i class="fas fa-shopping-cart text-6xl text-gray-300 mb-4"></i>
            <h2 class="text-2xl font-semibold mb-4">Votre panier est vide</h2>
            <a href="index.html" class="bg-black text-white px-6 py-3 rounded-lg hover:bg-gray-800 transition">Continuer vos achats</a>
        </div>

        <div id="cart-total" class="mt-8 bg-gray-50 p-6 rounded-lg hidden">
            <div class="flex justify-between items-center mb-4">
                <span class="text-xl font-semibold">Total:</span>
                <span id="total-price" class="text-2xl font-bold">0 FCFA</span>
            </div>
            <a href="checkout.html" class="w-full bg-black text-white py-3 rounded-lg hover:bg-gray-800 transition text-center block">Procéder au paiement</a>
        </div>
    </main>

    <footer class="bg-black text-white py-8 mt-16">
        <div class="container mx-auto px-4 text-center">
            <p>&copy; 2025 HEVER. Tous droits réservés.</p>
        </div>
    </footer>

    <script src="cart.js"></script>
</body>
</html>
