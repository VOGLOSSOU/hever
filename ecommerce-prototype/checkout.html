<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commande - HEVER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#000000',
                        secondary: '#ffffff',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-white text-black">
    <header class="bg-white text-black shadow-lg border-b border-gray-200">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="index.html" class="text-3xl font-bold tracking-wider">HEVER</a>
            <a href="cart.html" class="flex items-center space-x-2 hover:text-gray-600 transition">
                <i class="fas fa-shopping-cart text-xl"></i>
                <span>Panier (<span id="cart-count">0</span>)</span>
            </a>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold mb-8">Finaliser votre commande</h1>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div>
                <h2 class="text-2xl font-semibold mb-6">Informations de livraison</h2>
                <form id="checkout-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-2">Nom complet</label>
                        <input type="text" id="full-name" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-black">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2">Numéro WhatsApp</label>
                        <input type="tel" id="whatsapp" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-black">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2">Adresse de livraison</label>
                        <textarea id="address" required rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-black"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2">Instructions spéciales (optionnel)</label>
                        <textarea id="instructions" rows="2" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-black"></textarea>
                    </div>
                </form>
            </div>

            <div>
                <h2 class="text-2xl font-semibold mb-6">Récapitulatif de commande</h2>
                <div id="order-summary" class="bg-gray-50 p-4 rounded-lg">
                    <!-- Order summary will be loaded here -->
                </div>
                <button id="place-order" class="w-full bg-black text-white py-3 rounded-lg hover:bg-gray-800 transition mt-6">Confirmer la commande</button>
            </div>
        </div>
    </main>

    <footer class="bg-black text-white py-8 mt-16">
        <div class="container mx-auto px-4 text-center">
            <p>&copy; 2025 HEVER. Tous droits réservés.</p>
        </div>
    </footer>

    <script src="checkout.js"></script>
</body>
</html>
